<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Library Management System</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f9; }
        .navbar { background-color: #2c3e50; color: white; padding: 15px 20px; text-align: center; }
        .navbar a { color: white; text-decoration: none; margin: 0 15px; font-weight: bold; }
        .container { max-width: 900px; margin: 30px auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    </style>
</head>
<body>
    <div class="navbar">
        <a href="/">📚 Catalog</a>
        <a href="/admin/">⚙️ Admin Panel</a>
    </div>

    <div class="container">
        <!-- This block is where catalog.html and login.html will inject their specific content -->
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
